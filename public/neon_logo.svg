<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141c24" />
      <stop offset="100%" stop-color="#0b0f14" />
    </radialGradient>

    <!-- Neon Cyan Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="45%" stop-color="#00E5FF" />
      <stop offset="80%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>

    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded container matching ChatGPT / iOS app icon -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#00E5FF" stroke-width="4" stroke-opacity="0.35" />

  <!-- Neon "M/N" Monogram with lightning bolt from uploaded logo -->
  <g filter="url(#neonGlow)">
    <!-- Left vertical bar -->
    <path d="M148 140 C132 140 120 152 120 168 L120 344 C120 360 132 372 148 372 C164 372 176 360 176 344 L176 210 L256 312 L336 210 L336 344 C336 360 348 372 364 372 C380 372 392 360 392 344 L392 168 C392 152 380 140 364 140 C352 140 342 147 336 158 L256 264 L176 158 C170 147 160 140 148 140 Z" fill="url(#neonGradient)" />

    <!-- Sharp Center Energy Lightning Slash -->
    <polygon points="256,170 274,248 248,252 268,328 226,242 254,238" fill="url(#lightningGrad)" />
  </g>
</svg>
